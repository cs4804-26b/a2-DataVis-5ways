<!-- started with D3.js Graph Gallery's "Basic Scatterplot" as a reference, used Claude to help with debugging -->
<!doctype html>
<html lang="en">
  <head>
    <title>d3</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>
  <body>
    <svg id="chart"></svg>
    <script>
        const path = "C:/Users/victo/OneDrive/Documents/GitHub/a2-DataVis-5ways/penglings.csv";
        const margin = { top: 20, right: 120, bottom: 55, left: 70 },
            width = 900 - margin.left - margin.right,
            height = 550 - margin.top - margin.bottom;
        const svg = d3.select("#chart")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g").attr("transform", `translate(${margin.left},${margin.top})`);
        
        d3.csv(path, d3.autoType).then(raw => {
            const data = raw.filter(d => d.flipper_length_mm && d.body_mass_g && d.bill_length_mm);
            const x = d3.scaleLinear().domain([170, 235]).range([0, width]);
            const y = d3.scaleLinear().domain([2500, 6500]).range([height, 0]);
            const r = d3.scaleSqrt().domain(d3.extent(data, d => d.bill_length_mm)).range([3, 10]);
            const color = d3.scaleOrdinal().domain(["Adelie", "Chinstrap", "Gentoo"]).range(["orange", "purple", "teal"]);

            svg.append("g").attr("transform", `translate(0,${height})`).call(d3.axisBottom(x).ticks(7));
            svg.append("g").call(d3.axisLeft(y).ticks(8));
            
            svg.append("text").attr("x", width / 2).attr("y", height + 42).attr("text-anchor", "middle").text("Flipper Length (mm)");
            svg.append("text").attr("transform", "rotate(-90)").attr("x", -height / 2).attr("y", -52).attr("text-anchor", "middle").text("Body Mass (g)");

            svg.selectAll("dot").data(data).join("circle")
                .attr("cx", d => x(d.flipper_length_mm))
                .attr("cy", d => y(d.body_mass_g))
                .attr("r", d => r(d.bill_length_mm))
                .attr("fill", d => color(d.species))
                .attr("opacity", 0.8);
        });
    </script>
  </body>
</html>
