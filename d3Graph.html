<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>A2: d3 Example</title>
</head>
<body>
<div id="container"></div>
<script src="https://d3js.org/d3.v4.js"></script>
<div id="my_dataviz"></div>
<script>
    console.log("d3 version", d3.version);
    // set the dimensions and margins of the graph
    var margin = {top: 10, right: 30, bottom: 40, left: 60},
        width = 520 - margin.left - margin.right,
        height = 520 - margin.top - margin.bottom;

    // append the svg object to the body of the page
    var svg = d3.select("#my_dataviz")
        .append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform",
            "translate(" + margin.left + "," + margin.top + ")")

    // gray background!
    svg
        .append("rect")
        .attr("x",0)
        .attr("y",0)
        .attr("height", height)
        .attr("width", height)
        .attr("fill", "#e0e0e0");


    //read csv
    d3.csv("penglings.csv", function(rawData) {

        // parsing raw data to remove null values
        var data = rawData.map(function(d) {
            // not needed here, but if data was number in quotations, adding + to the start of it makes data numerical (ex. +d.body_mass_g)
            return {
                flipper_length_mm: d.flipper_length_mm,
                body_mass_g: d.body_mass_g,
                species: d.species,
                bill_length_mm : d.bill_length_mm,
            };
        }).filter(function(d) {
            return !isNaN(d.flipper_length_mm) && !isNaN(d.body_mass_g);
        });

        // adding x axis to be flipper length
        var x = d3.scaleLinear()
            .domain([170, d3.max(data, d => d.flipper_length_mm)]) // making sure it starts at 170
            .range([ 0, width ])
        svg.append("g")
            .attr("transform", "translate(0," + height + ")")
            .call(d3.axisBottom(x).tickSize(-height*1.3).ticks(10)) // 10 tick marks
            .select(".domain").remove()

        // adding y axis to be body mass (edited)
        var y = d3.scaleLinear()
            .domain(d3.extent(data, d =>d.body_mass_g))
            .range([ height, 0])
            .nice()
        svg.append("g")
            .call(d3.axisLeft(y).tickSize(-width*1.3).ticks(7))
            .select(".domain").remove()

        // to make strokes visible on gray background
        svg.selectAll(".tick line").attr("stroke", "white")

        // x axis label: (edited to be centered)
        svg.append("text")
            .attr("x", width/2 - margin.left)
            .attr("y", height + margin.top + 20)
            .text("Flipper Length (mm)");

        // y axis label: (edited to be centered)
        svg.append("text")
            .attr("transform", "rotate(-90)")
            .attr("y", -margin.left + 20)
            .attr("x",  -20 -margin.top -height/2 )
            .text("Body Mass (g)")

        // color scale! each species its own color yayyy
        var color = d3.scaleOrdinal()
            .domain(["Adelie", "Gentoo", "Chinstrap" ])
            .range([ "#01a2b0", "#c62423", "#ff818a"])

        // Add dots
        // svg.append('g')
        //     .selectAll("dot")
        //     .data(data)
        //     .enter()
        //     .append("circle")
        //     .attr("cx", function (d) { return x(d.flipper_length_mm); } ) // x coord dependent on flipper length
        //     .attr("cy", function (d) { return y(d.body_mass_g); } ) // y coord dependent on body mass
        //     .attr("r",  function (d) { return (d.bill_length_mm * 0.2); }) // radius dependent on bill length
        //     .attr("opacity", 0.8) // opacity 0.8, as outlined in instructions
        //     .style("fill", function (d) { return color(d.species)
        //     } )

        var svg2 = d3.select("#my_dataviz")
            .append("svg")
            .attr("width", width - 250)
            .attr("height", height - 100)
            .append("g")
            .attr("transform",
                "translate(" + margin.right + "," + margin.top + ")");


        // AI used to create tooltip.
        var tooltip = d3.select("#my_dataviz")
            .append("div")
            .style("position", "absolute")
            .style("visibility", "hidden")
            .style("background-color", "white")
            .style("border", "solid")
            .style("border-width", "1px")
            .style("border-radius", "5px")
            .style("padding", "10px");

        // 2. Attach hover listeners inside your circle selection
        svg.append('g')
            .selectAll("dot")
            .data(data)
            .enter()
            .append("circle")
            .attr("cx", function (d) { return x(d.flipper_length_mm); } )
            .attr("cy", function (d) { return y(d.body_mass_g); } )
            .attr("r",  function (d) { return (d.bill_length_mm * 0.2); })
            .attr("opacity", 0.8)
            .style("fill", function (d) { return color(d.species); })

            // --- TOOLTIP INTERACTION ---
            .on("mouseover", function(d) {
                tooltip.html("<b>Species:</b> " + d.species + "<br>" +
                    "<b>Flipper:</b> " + d.flipper_length_mm + " mm<br>" +
                    "<b>Mass:</b> " + d.body_mass_g + " g<br>" +
                    "<b>Bill Length:</b> " + d.bill_length_mm + " mm")
                    .style("visibility", "visible");
            })
            .on("mousemove", function(d) {
                tooltip.style("top", (d3.event.pageY - 10) + "px")
                    .style("left", (d3.event.pageX + 10) + "px");
            })
            .on("mouseout", function(d) {
                tooltip.style("visibility", "hidden");
            });

        // LEGEND

        var keys = ["Adelie", "Gentoo", "Chinstrap"];

        var sizes = [40, 50];


        svg2.append("text")
            .attr("x", -12)
            .attr("y", 5)
            .style("font-weight", "bold")
            .style("font-size", "16px")
            .text("Species");

        svg2.append("text")
            .attr("x", -12)
            .attr("y", 110)
            .style("font-weight", "bold")
            .style("font-size", "16px")
            .text("Bill Length (mm)");

        svg2.selectAll("mydots")
            .data(keys)
            .enter()
            .append("circle")
            .attr("cx", 0)
            .attr("cy", function(d,i){ return 25 + i*25})
            .attr("r", 7)
            .style("fill", function(d) { return color(d); });

        svg2.selectAll("mylabels")
            .data(keys)
            .enter()
            .append("text")
            .attr("x", 20)
            .attr("y", function(d,i){ return 25 + i*25})
            .style("fill", "black")
            .text(function(d){ return d})
            .attr("text-anchor", "left")
            .style("alignment-baseline", "middle")


        svg2.selectAll("dotsMore")
            .data(sizes)
            .enter()
            .append("circle")
            .attr("cx", 0)
            .attr("cy", function(d,i){ return 125 + i*25})
            .attr("r", function(d){ return (d * 0.2); })
            .style("fill", "gray" );

        svg2.selectAll("sizeLabels")
            .data(sizes)
            .enter()
            .append("text")
            .attr("x", 20)
            .attr("y", function(d,i){ return 125 + i*25})
            .style("fill", "black")
            .text(function(d){ return d + " mm"; })
            .attr("text-anchor", "left")
            .style("alignment-baseline", "middle")


    })


</script>
</body>
