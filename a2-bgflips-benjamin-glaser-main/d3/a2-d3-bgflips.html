<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3 Penguin Scatterplot</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .axis-label { font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>D3 Penguin Scatterplot</h1>
    <div id="chart"></div>
    <script>
        const width = 600;
        const height = 450;
        const margin = { top: 20, right: 20, bottom: 50, left: 50 };
        
        const svg = d3.select("#chart")
            .append("svg")
            .attr("width", width)
            .attr("height", height);
        
        d3.csv("../penglings.csv").then(function(data) {
            const pengclean = data.filter(d =>
                d.flipper_length_mm !== "NA" &&
                d.body_mass_g !== "NA" &&
                d.bill_length_mm !== "NA"
        );

        pengclean.forEach(d => {
            d.flipper_length_mm = +d.flipper_length_mm;
            d.body_mass_g = +d.body_mass_g;
            d.bill_length_mm = +d.bill_length_mm;
        });

        const xScale = d3.scaleLinear()
            .domain([170, 235])
            .range([margin.left, width - margin.right]);

        const yScale = d3.scaleLinear()
            .domain([2500, 6500])
            .range([height - margin.bottom, margin.top]);
        
        const rScale = d3.scaleLinear()
            .domain([30, 60])
            .range([3, 12]);

        const colorScale = d3.scaleOrdinal()
            .domain(["Adelie", "Chinstrap", "Gentoo"])
            .range(["darkorange", "darkorchid", "darkcyan"]);

        svg.append("g")
            .attr("transform", `translate(0, ${height - margin.bottom})`)
            .call(d3.axisBottom(xScale).ticks(7));
        
        svg.append("g")
            .attr("transform", `translate(${margin.left}, 0)`)
            .call(d3.axisLeft(yScale).ticks(5));

        svg.append("text")
            .attr("class", "axis-label")
            .attr("x", width / 2)
            .attr("y", height - 10)
            .attr("text-anchor", "middle")
            .text("Flipper Length (mm)");

        svg.append("text")
            .attr("class", "axis-label")
            .attr("transform", "rotate(-90)")
            .attr("x", -(height / 2))
            .attr("y", 10)
            .attr("text-anchor", "middle")
            .text("Body Mass (g)");

        svg.selectAll("circle")
            .data(pengclean)
            .enter()
            .append("circle")
            .attr("cx", d => xScale(d.flipper_length_mm))
            .attr("cy", d => yScale(d.body_mass_g))
            .attr("r", d => rScale(d.bill_length_mm))
            .attr("fill", d => colorScale(d.species))
            .attr("opacity", 0.8);
        });
    </script>
</body>
</html>
