<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>d3 Visualization</title>
</head>

<body>
    <div id="container"></div>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        console.log("d3 version", d3.version); // test that d3 loaded

        // SVG Element
        var svg = d3.select("#container")
            .append("svg")
            .attr("width", 700)
            .attr("height", 470)
            .style("background-color", "white");

        // Add the plot area
        var xScale = d3.scaleLinear().domain([170, 235]).range([70, 680]);
        var yScale = d3.scaleLinear().domain([2500, 6500]).range([415, 40]);
        var rScale = d3.scaleSqrt().domain([32, 60]).range([2, 8.5]);
        var colors = { Adelie: "purple", Chinstrap: "green", Gentoo: "pink" };

        // Grey background for the plot area
        svg.append("rect")
            .attr("x", 70)
            .attr("y", 40)
            .attr("width", 610)
            .attr("height", 375)
            .style("fill", "#EDEDED");

        [170, 180, 190, 200, 210, 220, 230].forEach(t => {
            svg.append("line")
                .attr("x1", xScale(t)).attr("y1", 40)
                .attr("x2", xScale(t)).attr("y2", 415)
                .style("stroke", "lightgrey")
                .style("stroke-width", 1);
            svg.append("text")
                .attr("x", xScale(t))
                .attr("y", 432)
                .text(t)
                .style("font-size", "12px")
                .style("font-family", "Calibri")
                .style("text-anchor", "middle");
            svg.append("line")
                .attr("x1", xScale(t)).attr("y1", 415)
                .attr("x2", xScale(t)).attr("y2", 420)
                .style("stroke", "black")
                .style("stroke-width", 1);
        });

        [2500, 3500, 4500, 5500, 6500].forEach(t => {
            svg.append("line")
                .attr("x1", 70).attr("y1", yScale(t))
                .attr("x2", 680).attr("y2", yScale(t))
                .style("stroke", "lightgrey")
                .style("stroke-width", 1);
            svg.append("text")
                .attr("x", 62)
                .attr("y", yScale(t) + 5)
                .text(t)
                .style("font-size", "12px")
                .style("font-family", "Calibri")
                .style("text-anchor", "end");
            svg.append("line")
                .attr("x1", 65).attr("y1", yScale(t))
                .attr("x2", 70).attr("y2", yScale(t))
                .style("stroke", "black")
                .style("stroke-width", 1);
        });

        // Title and Axis Labels
        svg.append("text")
            .attr("x", 350)
            .attr("y", 460)
            .text("Flipper Length (mm)")
            .style("font-family", "Calibri")
            .style("font-size", "16px")
            .style("text-anchor", "middle");

        svg.append("text")
            .attr("x", 150)
            .attr("y", 100)
            .text("Body Mass (g)")
            .style("font-family", "Calibri")
            .style("font-size", "16px")
            .style("text-anchor", "middle")
            .attr("transform", `rotate(-90, 150, 225)`);

        svg.append("text")
            .attr("x", 250)
            .attr("y", 24)
            .text("Body Mass by Flipper Length - Jake Dorick")
            .style("font-family", "Calibri")
            .style("font-size", "20px")
            .style("text-anchor", "middle");

        d3.csv("penglings.csv").then(data => {
            data.forEach(d => {
                if (d.flipper_length_mm === "NA"
                    || d.body_mass_g === "NA"
                    || d.bill_length_mm === "NA"
                    || d.bill_depth_mm === "NA") return; 
                svg.append("circle")
                    .attr("cx", xScale(+d.flipper_length_mm))
                    .attr("cy", yScale(+d.body_mass_g))
                    .attr("r", rScale(+d.bill_length_mm))
                    .style("fill", colors[d.species])
                    .style("opacity", 0.6);
            });
        });

    </script>
</body>

</html>
