<!DOCTYPE html>
<html lang="en">
<head>
  <title>A2 d3.js </title>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <script>
    console.log("d3 version", d3.version); // test that d3 loaded
    (async () => {
      let csv = await d3.csv("https://raw.githubusercontent.com/cs4804-26b/a2-DataVis-5ways/refs/heads/main/penglings.csv");
      const sid = {Adelie: 0, Gentoo: 1, Chinstrap: 2};
      csv = csv.map(e => {return {
            x: e.flipper_length_mm,
            y: e.body_mass_g,
            r: e.bill_length_mm,
            c: sid[e.species],
          }}).filter(e => !Object.values(e).some(isNaN));

      const body = document.querySelector("body");
      const width = 500;
      const height = 500;
      const margin = 50;

      const [xmin, xmax] = d3.extent(csv, d => d.x);
      const [ymin, ymax] = d3.extent(csv, d => d.y);
      const [rmin, rmax] = d3.extent(csv, d => d.r);
      const x = d3.scaleLinear([xmin, xmax], [margin, width - margin]);
      const y = d3.scaleLinear([ymin, ymax], [height - margin, margin]);
      const r = d3.scaleLinear([rmin, rmax], [3, 10]);

      const svg = d3.create("svg").attr("width", width).attr("height", height);
      const colors = ["#ffaa66b0", "#66bbaab0", "#aa66ffb0"];

      for (let d of csv) {
        svg.append("circle")
            .attr("cx", x(d.x))
            .attr("cy", y(d.y))
            .attr("r", r(d.r))
            .attr("fill", colors[d.c]);
      }

      svg.append("g")
          .attr("transform", "translate(0, " + (height - margin) + ")")
          .call(d3.axisBottom(x))
        .append("text")
          .text("Flipper Length (mm)")
          .attr("fill", "#000")
          .attr("transform", "translate(" + (width / 2) + ", 40)")
          .attr("font-size", 13);

      svg.append("g")
          .attr("transform", "translate(" + margin + ", 0)")
          .call(d3.axisLeft(y))
        .append("text")
          .text("Body Mass (g)")
          .attr("fill", "#000")
          .attr("transform", "rotate(-90) translate(" + (-height / 2 + margin) + ", -40)")
          .attr("font-size", 13);

      body.appendChild(svg.node());
    })()
  </script>
</body>
</html>
