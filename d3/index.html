<!doctype html>
<title>Penguin Scatterplot</title>
<p id="status">Loading penguin data...</p>
<script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    const rows = await d3.csv("../penglings.csv", d3.autoType)
    document.querySelector("#status").textContent = "Loaded " + rows.length + " rows. Columns: " + rows.columns.join(", ");

    const penguins = rows.filter(penguin => Number.isFinite(penguin.flipper_length_mm) &&
        Number.isFinite(penguin.body_mass_g) && 
        Number.isFinite(penguin.bill_length_mm));

    const x = d3.scaleLinear().domain(d3.extent(penguins, penguin => penguin.flipper_length_mm)).nice()
        .range([75, 670]);

    const y = d3.scaleLinear().domain(d3.extent(penguins, penguin => penguin.body_mass_g)).nice()
        .range([350, 20]);

    const svg = d3.select("body").append("svg").attr("viewBox", " 0 0 700 410")
        .attr("width", 700);

    svg.append("g").attr("transform", "translate(0, 350)").call(d3.axisBottom(x));

    svg.append("g").attr("transform", "translate(75, 0)").call(d3.axisLeft(y));

    svg.append("text").attr("x", 372).attr("y", 395).attr("text-anchor", "middle").text("Flipper length (mm)");

    svg.append("text").attr("transform", "translate(18,185) rotate(-90)").attr("text-anchor", "middle").text("Body mass (g)");

    const color = d3.scaleOrdinal().range(d3.schemeTableau10);
    const radius = d3.scaleSqrt().domain(d3.extent(penguins, penguin => penguin.bill_length_mm)).range([3, 7])

    svg.selectAll("circle").data(penguins).join("circle")
        .attr("cx", penguin => x(penguin.flipper_length_mm))
        .attr("cy", penguin => y(penguin.body_mass_g))
        .attr("fill", penguin => color(penguin.species))
        .attr("r", penguin => radius(penguin.bill_length_mm))
        .attr("opacity", 0.8)
</script>
