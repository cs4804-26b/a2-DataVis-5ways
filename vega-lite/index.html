<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vega-Lite Penguin Scatterplot</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@6"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@6"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
    <style>
        body {
            margin: 0;
            padding: 32px 20px;
            background: #f7f7f7;
            color: #1d1d1d;
            font-family: "Segoe UI", sans-serif;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
        }

        #vis {
            padding: 16px;
            overflow-x: auto;
            border: 1px solid #e1e1e1;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>

<body>
    <main>
        <div id="vis"></div>
    </main>

    <script>
        fetch("penguins.vl.json")
            .then((response) => {
                if (!response.ok) {
                    throw new Error(`Could not load chart specification: ${response.status}`);
                }

                return response.json();
            })
            .then((spec) => vegaEmbed("#vis", spec))
            .catch((error) => {
                document.querySelector("#vis").textContent = error.message;
                console.error(error);
            });
    </script>
</body>

</html>
