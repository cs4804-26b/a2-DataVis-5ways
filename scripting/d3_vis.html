<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A2: D3 Visualization</title>
</head>
<body>
  <div id="container"></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    console.log("d3 version", d3.version); // test that d3 loaded

    // The code for d3 scatterplot was created with the help from
    // an example from https://d3-graph-gallery.com/graph/scatter_basic.html, 
    // styling from https://d3-graph-gallery.com/graph/custom_theme.html, 
    // and tooltip hovers from 

    // set the dimensions and margins of the graph
    var margin = {top: 10, right: 30, bottom: 50, left: 60},
        width = 460 - margin.left - margin.right,
        height = 400 - margin.top - margin.bottom;

    // Add an SVG - container
    const svg = d3.select("#container").append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g").attr("transform", "translate(" + margin.left + "," + margin.top + ")");
    
    d3.csv("data/penglings.csv").then(function(data) {
        // Add X axis
        var x = d3.scaleLinear()
            .domain([160, 240])
            .range([ 0, width ]);
        svg.append("g")
            .attr("transform", "translate(0," + height + ")")
            .call(d3.axisBottom(x));

        // Add Y axis
        var y = d3.scaleLinear()
            .domain([2500, 6500])
            .range([ height, 0]);
        svg.append("g")
            .call(d3.axisLeft(y));
        
        // Add X axis label:
        svg.append("text")
            .attr("text-anchor", "end")
            .attr("x", width/2 + margin.left)
            .attr("y", height + margin.top + 20)
            .text("Flipper Length (mm)");

        // Y axis label:
        svg.append("text")
            .attr("text-anchor", "end")
            .attr("transform", "rotate(-90)")
            .attr("y", -margin.left + 20)
            .attr("x", (-margin.top - height)/2 + 50)
            .text("Body Mass (g)")


        // Color scale: give a species name, return a color
        var color = d3.scaleOrdinal()
            .domain(["Adelie", "Gentoo", "Chinstrap" ])
            .range([ "#F8766D", "#00BA38", "#619CFF"])

        // Add a tooltip div
        var tooltip = d3.select("#container")
            .append("div")
            .style("opacity", 0)
            .attr("class", "tooltip")
            .style("position", "absolute")
            .style("background-color", "white")
            .style("border", "solid")
            .style("border-width", "1px")
            .style("border-radius", "5px")
            .style("padding", "10px")

        // Change the information based on mouse over
        var mouseover = function(d) {
            tooltip.transition().duration(200).style("opacity", 1)
        }
        var mousemove = function(event, d) {
            var htmlStr = d.species+" Penguin from "+d.island+
                            "<br>Bill Length x Depth (mm): " + d.bill_length_mm + " x " + d.bill_depth_mm +
                            "<br>Flipper Length (mm): "+d.flipper_length_mm + 
                            "<br>Body Mass (g): "+d.body_mass_g+
                            "<br>Sex: "+d.sex+
                            "<br>Year: "+d.year;
            tooltip.html(htmlStr)
            tooltip.style("left", (event.x) + "px") // It is important to put the +90: other wise the tooltip is exactly where the point is an it creates a weird effect
                    .style("top", (event.y) + "px")
        }
        var mouseleave = function(d) {
            tooltip.transition().duration(200).style("opacity", 0)
        }

        // Add dots
        svg.append('g')
            .selectAll("dot")
            .data(data)
            .enter()
            .append("circle")
            .attr("cx", function (d) { return x(d.flipper_length_mm); } )
            .attr("cy", function (d) { return y(d.body_mass_g); } )
            .attr("r", function (d) { return d.bill_length_mm/10; })
            .style("fill", function (d) { return color(d.species) } )
            .style("opacity", 0.3)
            .on("mouseover", mouseover )
            .on("mousemove", mousemove )
            .on("mouseleave", mouseleave )
        });
  </script>
</body>
</html>
