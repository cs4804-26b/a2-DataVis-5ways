<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A2: d3 chart</title>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

    <div id="graph"></div>

    <script type="module">
      const svg = d3
        .select("#graph")
        .append("svg")
        .attr("width", 600)
        .attr("height", 400);

      const x = d3.scaleLinear().domain([170, 235]).range([60, 570]);
      svg
        .append("g")
        .attr("transform", "translate(0,350)")
        .call(d3.axisBottom(x).tickValues(d3.range(170, 231, 10)));

      const y = d3.scaleLinear().domain([2500, 6500]).range([350, 10]);
      svg
        .append("g")
        .attr("transform", "translate(60,0)")
        .call(
          d3
            .axisLeft(y)
            .tickValues(d3.range(3000, 6001, 1000))
            .tickFormat(d3.format("d")),
        );

      svg
        .append("text")
        .attr("x", 315)
        .attr("y", 392)
        .attr("text-anchor", "middle")
        .text("Flipper Length (mm)");

      svg
        .append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -180)
        .attr("y", 18)
        .attr("text-anchor", "middle")
        .text("Body Mass (g)");

      const data = await d3.csv("../penglings.csv", (d) => ({
        flipper_length_mm: +d.flipper_length_mm,
        body_mass_g: +d.body_mass_g,
        species: d.species,
        bill_length_mm: +d.bill_length_mm,
      }));

      const clean = data.filter(
        (d) =>
          Number.isFinite(d.flipper_length_mm) &&
          Number.isFinite(d.body_mass_g) &&
          Number.isFinite(d.bill_length_mm),
      );

      const color = d3
        .scaleOrdinal()
        .domain(["Adelie", "Chinstrap", "Gentoo"])
        .range(["#ff8c00", "#a52bd4", "#008b8b"]);

      const size = d3
        .scaleSqrt()
        .domain(d3.extent(clean, (d) => d.bill_length_mm))
        .range([3, 12]);

      svg
        .append("g")
        .selectAll("circle")
        .data(clean)
        .enter()
        .append("circle")
        .attr("cx", (d) => x(d.flipper_length_mm))
        .attr("cy", (d) => y(d.body_mass_g))
        .attr("r", (d) => size(d.bill_length_mm))
        .style("fill", (d) => color(d.species))
        .style("opacity", 0.8)
        .text(
          (d) =>
            `${d.species}\nFlipper: ${d.flipper_length_mm} mm\nMass: ${d.body_mass_g} g\nBill: ${d.bill_length_mm} mm`,
        );
    </script>
  </body>
</html>
