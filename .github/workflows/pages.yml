name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate the static chart data
        run: python3 scripts/build_static_data.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html README.md penglings.csv .nojekyll _site/
          cp -R img JavaD3 JavaP5JS PythonAltair Excel RStudio _site/
          rm -f _site/JavaD3/*.class _site/JavaP5JS/*.class
          touch _site/.nojekyll

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
