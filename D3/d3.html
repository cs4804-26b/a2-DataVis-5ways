<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A2: Visualization d3</title>
</head>
<body>
  <div id="container"></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    console.log("d3 version", d3.version); // test that d3 loaded

    //outside source used to get started 
    var margin = {top: 20, right: 150, bottom: 50, left: 70},
    width = 1060 - margin.left - margin.right,
    height = 760 - margin.top - margin.bottom;

    // Add an SVG
    var svg = d3.select("#container")
    .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
    .append("g")
    .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
  
    // background
    svg.append("rect")
      .attr("x", 0)
      .attr("y", 0)
      .attr("width", width)
      .attr("height", height)
      .style("fill", "#EBEBEB");


    // load csv
    d3.csv("../penglings.csv").then(function(data) {

      data.forEach(function(d) {
        d.bill_length_mm = Number(d.bill_length_mm);
        d.flipper_length_mm = Number(d.flipper_length_mm);
        d.body_mass_g = Number(d.body_mass_g);
      });

      //remove NA rows
      data.filter(function(d) {
        return !isNaN(d.bill_length_mm) && !isNaN(d.flipper_length_mm) && !isNaN(d.body_mass_g);
      });

      // Add X axis
      var x = d3.scaleLinear()
        .domain([170, 235])
        .range([0, width]);
      svg.append("g")
        .attr("transform", "translate(0," + height + ")")
        .call(d3.axisBottom(x).tickSize(-height).ticks(7))
        .select(".domain").remove();

      // Add Y axis
      var y = d3.scaleLinear()
        .domain([2500, 6500])
        .range([height, 0]);
      svg.append("g")
        .call(d3.axisLeft(y).tickSize(-width).ticks(7))
        .select(".domain").remove();

      // Customization
      svg.selectAll(".tick line").attr("stroke", "white");
      svg.selectAll(".tick text").attr("fill", "#4d4d4d").style("font-size", 11);

      // Add X axis label
      svg.append("text")
        .attr("text-anchor", "middle")
        .attr("x", width / 2)
        .attr("y", height + 40)
        .text("Flipper Length (mm)");

      // Add Y axis label
      svg.append("text")
        .attr("text-anchor", "middle")
        .attr("transform", "rotate(-90)")
        .attr("x", -height / 2)
        .attr("y", -margin.left + 20)
        .text("Body Mass (g)");

      // Color scale
      var color = d3.scaleOrdinal()
        .domain(["Adelie", "Chinstrap", "Gentoo"])
        .range(["#F5A142", "#9B3FD4", "#4A9A98"]);

      // Size scale
      var size = d3.scaleSqrt()
        .domain(d3.extent(data, function(d) { return d.bill_length_mm; }))
        .range([5, 20]);

      // Add dots
      svg.append("g")
        .selectAll("dot")
        .data(data)
        .enter()
        .append("circle")
          .attr("cx", function(d) { return x(d.flipper_length_mm); })
          .attr("cy", function(d) { return y(d.body_mass_g); })
          .attr("r", function(d) { return size(d.bill_length_mm); })
          .style("fill", function(d) { return color(d.species); })
          .style("opacity", 0.8);

    })

  </script>
</body>
</html>
